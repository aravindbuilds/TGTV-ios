name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build TGTV.ipa on macOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.tgtv.iphone' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate secrets source
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}
        run: |
          mkdir -p TGTV/Generated
          cat > TGTV/Generated/GeneratedSecrets.swift <<EOF
          // Generated by CI. Do not commit.
          enum GeneratedSecrets {
              static let apiId: Int64 = ${TG_API_ID:-0}
              static let apiHash: String = "${TG_API_HASH:-}"
              static let tmdbKey: String = "${TMDB_KEY:-}"
              static let openSubtitlesKey: String = "${OPENSUBTITLES_KEY:-}"
          }
          EOF

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project TGTV.xcodeproj -scheme TGTV

      # ---------------------------------------------------------------- signing
      - name: Import signing certificate and provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'tgtv-ci-keychain' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ------------------------------------------------------------ unsigned IPA
      - name: Build unsigned app
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild -project TGTV.xcodeproj -scheme TGTV \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TGTV.app"
          test -d "$APP" || { echo "App bundle missing at $APP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/TGTV.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/TGTV.ipa" Payload
          echo "Unsigned IPA created (sideload with AltStore/Sideloadly to install)."

      # -------------------------------------------------------------- signed IPA
      - name: Archive signed app
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild -project TGTV.xcodeproj -scheme TGTV \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TGTV.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      - name: Export signed IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TGTV.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/TGTV.ipa" "$RUNNER_TEMP/TGTV.ipa"

      # ------------------------------------------------------------------ output
      - name: Verify IPA
        run: |
          ls -lh "$RUNNER_TEMP/TGTV.ipa"
          unzip -l "$RUNNER_TEMP/TGTV.ipa" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGTV-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/TGTV.ipa
          retention-days: 30

      - name: Attach IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/TGTV.ipa
          generate_release_notes: true
